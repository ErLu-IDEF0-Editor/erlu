name: Release bundles
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    uses: ./.github/workflows/build.yml
  bundle:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect desktop archives and AppImage, then bundle the web build
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, shutil
          root = pathlib.Path('artifacts')
          out = pathlib.Path('release')
          out.mkdir()
          desktop_assets = {
              'erlu-x86_64-unknown-linux-gnu': 'erlu-x86_64-unknown-linux-gnu.tar.gz',
              'erlu-x86_64-pc-windows-msvc': 'erlu-x86_64-pc-windows-msvc.zip',
              'erlu-aarch64-apple-darwin': 'erlu-aarch64-apple-darwin.zip',
              'erlu-x86_64-apple-darwin': 'erlu-x86_64-apple-darwin.zip',
              'erlu-appimage': 'erlu-x86_64-unknown-linux-gnu.AppImage',
          }
          for artifact, filename in desktop_assets.items():
              source = root / artifact / filename
              if not source.is_file():
                  raise SystemExit(f'Missing release asset: {source}')
              shutil.copy2(source, out / filename)
          (out / desktop_assets['erlu-appimage']).chmod(0o755)
          web = root / 'erlu-web'
          if not (web / 'index.html').is_file():
              raise SystemExit('Missing web build')
          shutil.make_archive(str(out / 'erlu-web'), 'zip', web)
          with (out / 'SHA256SUMS').open('w', encoding='ascii') as sums:
              for filename in sorted([*desktop_assets.values(), 'erlu-web.zip']):
                  with (out / filename).open('rb') as asset:
                      digest = hashlib.file_digest(asset, 'sha256').hexdigest()
                  sums.write(f'{digest}  {filename}\n')
          PY
          (cd release && sha256sum --check --strict SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: erlu-release-bundles
          path: release/
          if-no-files-found: error
