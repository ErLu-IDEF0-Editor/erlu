[package]
name = "erlu"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "erlu_app"
crate-type = ["rlib"]

[dependencies]
erlu-core.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "persistence"] }
rfd = { version = "0.18", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["x11", "wayland", "clipboard"] }
rfd = { version = "0.18", default-features = false, features = ["xdg-portal", "wayland"] }
erlu-plugins.workspace = true
rmcp = { version = "3.11", features = ["server", "transport-io", "transport-streamable-http-server"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "net", "signal", "time"] }
axum = "0.8"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement", "HtmlElement", "Blob", "BlobPropertyBag", "Url", "HtmlAnchorElement", "BeforeUnloadEvent", "MessageEvent", "MessagePort", "MessageChannel", "EventTarget", "IdbFactory", "IdbDatabase", "IdbOpenDbRequest", "IdbRequest", "IdbTransaction", "IdbTransactionMode", "IdbObjectStore", "DomStringList", "Event", "Location", "File", "FileList", "DataTransfer", "DragEvent"] }
