[package]
name = "erlu-semantic-dictionary"
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-or-later"

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wit-bindgen = "0.57"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
opt-level = "s"
strip = true
